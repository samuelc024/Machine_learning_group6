[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "challenge6"
version = "0.1.0"
description = "Modular training environment for the Grupo 6 challenge"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "matplotlib>=3.8",
  "scipy>=1.11",
  "scikit-learn>=1.5",
  "torch>=2.5.1",
  "umap-learn>=0.5.6",
  "seaborn>=0.13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
challenge6-train = "challenge6.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
