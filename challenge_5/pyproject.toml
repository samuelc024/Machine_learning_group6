[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "challenge5-grupo6"
version = "0.1.0"
description = "Challenge 5 — Grupo 6: Housing & Urban Development"
readme = "README.md"
authors = [ { name = "Grupo 6" } ]
requires-python = ">=3.8"
license = { text = "MIT" }

dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "matplotlib>=3.5",
  "seaborn>=0.12",
  "scikit-learn>=1.0",
  "scipy>=1.8",
  "umap-learn>=0.5"
]

[tool.setuptools]
packages = ["."]
